version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "role"
            go_type:
              type: "string"
          - db_type: "application_status"
            go_type:
              type: "string"
          - db_type: "notification_type"
            go_type:
              type: "string"
          - db_type: "report_status"
            go_type:
              type: "string"
